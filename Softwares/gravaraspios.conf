# gravaraspios.conf - parametros do GravaRaspiOS, lidos a cada gravacao
# (nucleo 1.3.0 em diante). Mudar aqui e publicar (nucleo/publicar.sh) ajusta
# o gravador SEM recompilar: as janelas baixam este arquivo a cada execucao,
# conferem pelo GravaRaspiOS.SHA256SUMS e o deixam ao lado do nucleo.
# Linha estragada nao derruba o gravador (vale o padrao compilado e o
# relatorio avisa), mas o teste do gravador recusa publicar com aviso.

# versao deste formato (o nucleo 1.3.0 entende a 1)
VERSAO_CONF=1

# geracao do selo da imagem (GERACAO_IMAGEM do injetar-firstboot.sh): imagem
# mais antiga e recusada. 3 = 27/11 (relogio sem NTP, rede, kioskd em Rust,
# sem kioskd.py): a V2 (geracao 2) nao vai mais ao cartao.
GERACAO_MINIMA=3

# lite: recusa imagem com base Desktop (lido do selo) | qualquer
BASE_EXIGIDA=lite

# imagens aprovadas, uma por linha, pelo sha256 do ARQUIVO como o tecnico o
# tem (.img ou .img.xz):  IMAGEM_APROVADA=<sha256> <nome>
# Com EXIGIR_APROVADA=sim, so grava imagem desta lista; com nao, imagem fora
# dela so gera aviso.
# 2.1 (27/11): gerada pelo CI do main em be47bc6, kioskd 0.1.10 embarcado
IMAGEM_APROVADA=b72e0145bf010e24f4787bf1c523172cbf8ad8d05530e96c6624d0420e7155be RaspiAutoInstallV2.1.img.xz
IMAGEM_APROVADA=7a5406b503ef4161dd101c0a017cf709f4843757400abde46314dcb63873cab7 RaspiAutoInstallV2.1.img
EXIGIR_APROVADA=nao

# recado mostrado no relatorio antes de gravar (vazio: nenhum)
MENSAGEM=
